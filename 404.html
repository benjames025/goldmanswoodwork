<style>
:root{--dark:#1C1008;--wood:#5C3A1E;--gold:#C9973A;--gold-light:#E8B85A;--sand:#F2E6D4;--cream:#FAF7F2;--text:#1A0F07;--muted:#7A6050;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Heebo',sans-serif;background:var(--cream);color:var(--text);direction:rtl;min-height:100vh;display:flex;flex-direction:column;}
.wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;max-width:640px;margin:0 auto;}
.mark{font-size:.72rem;font-weight:700;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:28px;}
.code{font-size:clamp(4.5rem,18vw,8rem);font-weight:900;line-height:.9;color:var(--wood);opacity:.16;letter-spacing:-.04em;}
h1{font-size:clamp(1.5rem,5vw,2.1rem);font-weight:700;margin-top:-18px;letter-spacing:-.01em;}
p{color:var(--muted);font-size:1rem;line-height:1.7;margin-top:14px;max-width:44ch;}
.rule{width:56px;height:2px;background:var(--gold);margin:30px auto;border-radius:2px;}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:6px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:12px;font-size:.95rem;font-weight:700;text-decoration:none;transition:transform .2s ease,box-shadow .2s ease,background .2s ease;}
.btn-primary{background:var(--dark);color:var(--cream);box-shadow:0 8px 22px -10px rgba(28,16,8,.7);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(28,16,8,.75);}
.btn-ghost{background:transparent;color:var(--wood);border:1.5px solid rgba(92,58,30,.24);}
.btn-ghost:hover{background:rgba(92,58,30,.06);transform:translateY(-2px);}
.links{margin-top:34px;display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:center;}
.links a{color:var(--muted);font-size:.9rem;text-decoration:none;border-bottom:1px solid transparent;transition:color .2s,border-color .2s;}
.links a:hover{color:var(--wood);border-bottom-color:var(--gold);}
footer{padding:26px 24px;text-align:center;color:var(--muted);font-size:.82rem;border-top:1px solid rgba(92,58,30,.1);}
a:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;}}
</style>
</head>
<body>
<main class="wrap">
  <div class="mark">גולדמנס וודוורק</div>
  <div class="code">404</div>
  <h1>הדף שחיפשתם לא נמצא</h1>
  <p>ייתכן שהקישור ישן או שהוקלדה כתובת שגויה. אפשר לחזור לדף הבית ולראות את העבודות שלנו, או פשוט לדבר איתנו.</p>
  <div class="rule"></div>
  <div class="actions">
    <a class="btn btn-primary" href="/">חזרה לדף הבית</a>
    <a class="btn btn-ghost" href="https://wa.me/972556651800" target="_blank" rel="noopener">דברו איתנו בוואטסאפ</a>
  </div>
  <nav class="links">
    <a href="/#gallery">גלריה</a>
    <a href="/#services">שירותים</a>
    <a href="/#about">עלינו</a>
    <a href="/#request">בקשת הצעת מחיר</a>
    <a href="tel:0556651800">055-665-1800</a>
  </nav>
</main>
<footer>גולדמנס וודוורק &middot; קיבוץ בית זרע</footer>
</body>
</html>
